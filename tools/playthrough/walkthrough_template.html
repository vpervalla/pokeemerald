<title>Kanto–Hoenn Walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Pixelify+Sans:wght@500;600&display=swap">
<style>
/* Layout: a route-sign sidebar of areas in play order, one area per page, screenshots at 1.5x with hard pixels. */
:root {
  --bg: #eef1ec; --surface: #fafbf8; --ink: #14201a; --muted: #566259; --line: #d3dacf;
  --accent: #2b7a4b; --on-accent: #ffffff; --tint: #dfe9dd; --alert: #b8372f; --alert-tint: #f5e1de;
  --font-display: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  --font-body: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1612; --surface: #17211b; --ink: #e6ece7; --muted: #98a69c; --line: #2a3830;
    --accent: #5bbf86; --on-accent: #0b130e; --tint: #1c2b22; --alert: #f08a80; --alert-tint: #34201e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1612; --surface: #17211b; --ink: #e6ece7; --muted: #98a69c; --line: #2a3830;
  --accent: #5bbf86; --on-accent: #0b130e; --tint: #1c2b22; --alert: #f08a80; --alert-tint: #34201e; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
a { color: var(--accent); text-underline-offset: 2px; }
code { font-family: var(--font-mono); font-size: .86em; word-break: break-all; background: var(--tint); padding: .1em .35em; border-radius: 3px; overflow-wrap: anywhere; }

.shell { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: 2.5rem; max-width: 74rem; margin: 0 auto;
  padding-block: 1.5rem 4rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
nav { position: sticky; top: 1.5rem; align-self: start; display: flex; flex-direction: column; gap: .15rem; }
nav .brand { font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; line-height: 1.15; margin: 0 0 1rem; text-wrap: balance; }
nav .brand small { display: block; font-family: var(--font-body); font-weight: 400; font-size: .75rem; color: var(--muted); margin-top: .3rem; }
nav a { display: flex; gap: .7rem; align-items: baseline; padding: .45rem .6rem; border-radius: 6px; color: var(--ink); text-decoration: none; border-left: 3px solid transparent; }
nav a .n { font-family: var(--font-display); font-weight: 500; color: var(--muted); min-width: 1.4rem; }
nav a:hover { background: var(--tint); }
nav a[aria-current="page"] { background: var(--tint); border-left-color: var(--accent); font-weight: 600; }
nav a[data-id="bugs"] .n { color: var(--alert); }
nav a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { min-width: 0; }
article header { margin-bottom: 1.5rem; padding-bottom: 1.25rem; border-bottom: 2px solid var(--line); }
.eyebrow { margin: 0 0 .3rem; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
h1, h2, nav .brand { font-variant-ligatures: none; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.05; margin: 0 0 .9rem; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; margin: 0 0 .7rem; padding-top: .3rem; text-wrap: balance; }
h3 { font-size: 1rem; margin: 1.2rem 0 .4rem; }
section { margin: 0 0 2.2rem; max-width: 46rem; }
.lead { max-width: 46rem; font-size: 1.05rem; }
.lead p, section p { margin: 0 0 .8rem; }
ul, ol { padding-left: 1.3rem; margin: 0 0 .9rem; }
li { margin: 0 0 .5rem; padding-left: .2rem; }
li::marker { color: var(--accent); font-weight: 600; }
ol li ul { margin-top: .5rem; }
strong { font-weight: 600; }
em { color: var(--muted); }

figure { display: inline-block; margin: .5rem .8rem .5rem 0; vertical-align: top; max-width: 100%; }
figure img { display: block; width: 360px; max-width: 100%; height: auto; image-rendering: pixelated; border: 2px solid var(--line); border-radius: 4px; background: var(--surface); }
figcaption { font-size: .78rem; color: var(--muted); margin-top: .25rem; }

.status { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 1.5rem 2.5rem; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 1.2rem 1.4rem; }
.status h3 { margin-top: 0; font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
dl { margin: 0; display: grid; gap: .55rem; }
dl div { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: .8rem; align-items: baseline; }
dt { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
dd { margin: 0; font-variant-numeric: tabular-nums; }
.party { list-style: none; padding: 0; margin: 0; }
.party li { padding: .6rem .8rem; border: 1px solid var(--line); border-radius: 6px; display: grid; grid-template-columns: auto auto; justify-content: start; gap: 0 .6rem; }
.party .mon { font-family: var(--font-display); font-weight: 600; font-size: 1.1rem; }
.party .lv { color: var(--accent); font-weight: 600; align-self: end; }
.party .mv { grid-column: 1 / -1; font-size: .82rem; color: var(--muted); }
.legs { list-style: none; padding: 0; counter-reset: leg; display: grid; gap: .5rem; }
.legs li { counter-increment: leg; display: grid; grid-template-columns: 2rem minmax(0, 1fr); gap: .1rem .8rem; padding: .7rem .9rem; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.legs li::before { content: counter(leg); grid-row: span 2; font-family: var(--font-display); font-weight: 600; font-size: 1.4rem; color: var(--muted); }
.legs li span { color: var(--muted); font-size: .9rem; }
.legs li.now { border-color: var(--accent); background: var(--tint); }
.legs li.now::before { color: var(--accent); }
.learned { list-style: none; padding: 0; }
.learned li { padding: .6rem 0; border-top: 1px solid var(--line); display: grid; gap: .1rem; }
.learned strong { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }

.tbl { overflow-x: auto; margin: 0 0 1rem; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: .5rem .7rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
article#p-bugs td:last-child { color: var(--alert); font-weight: 600; }

@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 1rem; padding-top: 1rem; }
  nav { position: static; flex-direction: row; overflow-x: auto; gap: .3rem; padding-bottom: .5rem; border-bottom: 1px solid var(--line); flex-wrap: nowrap; }
  nav .brand { display: none; }
  nav a { flex: none; border-left: 0; border-bottom: 3px solid transparent; border-radius: 6px 6px 0 0; padding: .4rem .6rem; }
  nav a[aria-current="page"] { border-bottom-color: var(--accent); }
  .status { grid-template-columns: minmax(0, 1fr); }
  dl div { grid-template-columns: 5.5rem minmax(0, 1fr); }
  figure img { width: 100%; }
  figure { display: block; margin-right: 0; }
}
@media (prefers-reduced-motion: no-preference) { article:not([hidden]) { animation: rise .25s ease-out; } }
@keyframes rise { from { opacity: .0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>

<div class="shell">
  <nav aria-label="Areas">
    <p class="brand">Kanto–Hoenn Walkthrough<small>ETHAN, Pikachu start</small></p>
    %%NAV%%
  </nav>
  <main>
%%PAGES%%
  </main>
</div>

<script>
(function () {
  var links = Array.prototype.slice.call(document.querySelectorAll("nav a"));
  var pages = Array.prototype.slice.call(document.querySelectorAll("article"));
  function show() {
    var id = (location.hash || "").replace("#", "") || "overview";
    if (!document.getElementById("p-" + id)) id = "overview";
    pages.forEach(function (p) { p.hidden = p.id !== "p-" + id; });
    links.forEach(function (a) {
      if (a.getAttribute("data-id") === id) { a.setAttribute("aria-current", "page"); a.scrollIntoView({ block: "nearest", inline: "nearest" }); }
      else a.removeAttribute("aria-current");
    });
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", show);
  show();
})();
</script>
