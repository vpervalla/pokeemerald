<title>Kanto–Hoenn Walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>/* Layout: masthead + sticky page tabs; each page is a column of route signs, each with reference panels and a boxed playthrough log */
:root {
  --bg: #eef2e6;
  --panel: #f8faf3;
  --ink: #23301f;
  --muted: #5b6852;
  --line: #cdd7bf;
  --wood: #c8925a;
  --wood-dark: #7a4a22;
  --wood-ink: #3a220d;
  --accent: #b5420f;
  --gold: #d9a21b;
  --frame: #1d2a1b;
  --runbg: #f6efe2;
  --tabbg: #e2e9d6;
  --f-display: "Pixelify Sans", "Courier New", monospace;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a13; --panel: #1c241a; --ink: #e3ead9; --muted: #a2ae96; --line: #33402f;
    --wood: #a8733f; --wood-dark: #5e3816; --wood-ink: #24140a; --accent: #f08a4b; --gold: #f0c04a;
    --frame: #0b0f0a; --runbg: #221c14; --tabbg: #1a2118;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141a13; --panel: #1c241a; --ink: #e3ead9; --muted: #a2ae96; --line: #33402f;
  --wood: #a8733f; --wood-dark: #5e3816; --wood-ink: #24140a; --accent: #f08a4b; --gold: #f0c04a;
  --frame: #0b0f0a; --runbg: #221c14; --tabbg: #1a2118;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 1.0625rem; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--tabbg); }
.wrap { max-width: 60rem; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.head { padding-block: 2.25rem 1.5rem; display: grid; gap: 1.25rem; }
main.wrap { padding-block: 2rem 4rem; }
.page { display: grid; gap: 2.75rem; }
.page[hidden] { display: none !important; }
h1, h2 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 6vw, 3.25rem); line-height: 1.05; font-weight: 700; }
h1 em { font-style: normal; color: var(--accent); }
.lede { max-width: 62ch; color: var(--muted); margin: .75rem 0 0; }
.kicker { font-family: var(--f-data); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 .5rem; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: 1rem; }
.fact { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 1rem 1.1rem; min-width: 0; }
.fact h3 { font-family: var(--f-data); font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 .4rem; font-weight: 600; }
.fact p { margin: 0; }
.fact .big { font-family: var(--f-display); font-size: 1.35rem; }
.mono { font-family: var(--f-data); font-size: .9rem; font-variant-numeric: tabular-nums; }

/* page tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--tabbg); border-block: 1px solid var(--line); }
.tabrow { display: flex; gap: .25rem; overflow-x: auto; padding-block: .5rem; scrollbar-width: thin; }
.tab { flex: none; display: inline-flex; align-items: center; gap: .45rem; padding: .4rem .8rem .45rem .5rem; border-radius: 4px; color: var(--ink);
  text-decoration: none; font-family: var(--f-data); font-size: .85rem; white-space: nowrap; border: 2px solid transparent; }
.tab .tn { font-family: var(--f-display); font-weight: 700; font-size: .85rem; min-width: 1.4rem; height: 1.4rem; display: grid; place-items: center;
  border-radius: 3px; background: var(--line); color: var(--ink); }
.tab:hover { background: var(--panel); }
.tab.on { background: var(--wood); color: var(--wood-ink); border-color: var(--wood-dark); }
.tab.on .tn { background: var(--wood-ink); color: var(--wood); }
.tab:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pager { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 1.25rem; }
.pg { font-family: var(--f-display); font-size: 1.1rem; color: var(--wood-ink); background: var(--wood); border: 3px solid var(--wood-dark); border-radius: 4px;
  padding: .35rem .9rem; text-decoration: none; box-shadow: 0 3px 0 var(--wood-dark); }
.pg:hover { filter: brightness(1.06); }

/* route signs */
.step { display: grid; gap: 1.1rem; }
.sign { display: flex; align-items: center; gap: .9rem; align-self: start; width: fit-content; max-width: 100%;
  background: var(--wood); color: var(--wood-ink); border: 3px solid var(--wood-dark); border-radius: 4px;
  padding: .55rem 1.1rem .6rem .7rem; box-shadow: 0 4px 0 var(--wood-dark); }
.sign .num { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; background: var(--wood-ink); color: var(--wood);
  min-width: 2rem; height: 2rem; display: grid; place-items: center; border-radius: 3px; }
.sign h2 { font-size: 1.45rem; font-weight: 700; line-height: 1.1; }
.sign .sub { margin: 0; font-family: var(--f-data); font-size: .78rem; letter-spacing: .04em; }
.moves { margin: 0; padding-left: 1.3rem; display: grid; gap: .45rem; max-width: 68ch; }
.moves li::marker { color: var(--accent); font-family: var(--f-data); font-size: .85em; }
.shots { display: flex; flex-wrap: wrap; gap: 1rem; }
.shots:empty { display: none; }
figure.shot { margin: 0; width: 240px; max-width: 100%; display: grid; gap: .35rem; align-content: start; }
figure.shot img { display: block; width: 240px; max-width: 100%; height: auto; image-rendering: pixelated;
  border: 4px solid var(--frame); border-radius: 4px; background: var(--frame); }
figcaption { font-size: .85rem; color: var(--muted); }
@media (min-width: 720px) { figure.shot, figure.shot img { width: 288px; } }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
.tablewrap { overflow-x: auto; }
th, td { text-align: left; padding: .45rem .7rem; border-bottom: 1px solid var(--line); }
th { font-family: var(--f-data); font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
td.n { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.notes { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 4px; padding: 1.1rem 1.25rem; }
.notes h2 { font-size: 1.3rem; margin-bottom: .5rem; }
.notes ul { margin: 0; padding-left: 1.2rem; display: grid; gap: .5rem; max-width: 72ch; }
code { font-family: var(--f-data); font-size: .88em; background: var(--line); padding: .05em .35em; border-radius: 3px; overflow-wrap: anywhere; }

.run { display: grid; gap: .9rem; background: var(--runbg); border: 2px dashed var(--wood); border-radius: 6px; padding: 1rem 1.1rem 1.2rem; }
.run h3 { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; }
.runtag { background: var(--wood); color: var(--wood-ink); border-radius: 3px; padding: .15rem .5rem; letter-spacing: .06em; }
.run .moves > li { display: grid; gap: .6rem; }
.run .moves p { margin: 0; }
.monname { display: inline-flex; align-items: center; gap: .15rem; }
.mon { width: 32px; height: 32px; image-rendering: pixelated; margin: -8px 0; flex: none; }
.run h3, .panel h3 { font-family: var(--f-data); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 600; }
.ref { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 1rem; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 1rem 1.1rem; display: grid; gap: .7rem; align-content: start; min-width: 0; }
.panel.wide { grid-column: 1 / -1; }
.hint { font-family: var(--f-body); text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); font-size: .85rem; margin: 0; }
.mapscroll { overflow: auto; max-height: 40rem; width: fit-content; max-width: 100%; border: 4px solid var(--frame); border-radius: 4px; background: var(--frame); }
.map { display: block; max-width: none; height: auto; image-rendering: pixelated; }
@media (max-width: 720px) { .map { max-width: 100%; } .mapscroll { max-height: none; } }
.key { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: .35rem .6rem; font-size: .85rem; color: var(--muted); }
.mk { display: inline-grid; place-items: center; min-width: 1.6rem; height: 1.6rem; padding: 0 .3rem; font-family: var(--f-data); font-size: .75rem; font-weight: 600; color: #fff; flex: none; }
.mk.item { background: #d63428; border-radius: 50%; }
.mk.gift { background: #2878c8; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); min-width: 1.8rem; height: 1.8rem; }
.mk.trainer { background: #f09614; border-radius: 3px; color: #2a1800; }
.mk.hidden { background: var(--panel); color: #d63428; border: 3px solid #d63428; border-radius: 50%; }
.mk.cut { background: var(--panel); color: #787878; border: 3px solid #787878; border-radius: 50%; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: .55rem; }
.legend li { display: flex; gap: .6rem; align-items: flex-start; }
.legend li > span:last-child { min-width: 0; }
.chip { display: inline-block; font-family: var(--f-data); font-size: .7rem; padding: .05rem .4rem; border-radius: 999px; margin-left: .25rem; white-space: nowrap; }
.chip.yes { background: color-mix(in srgb, #3a9a4a 22%, transparent); color: var(--ink); }
.chip.no { background: var(--line); color: var(--muted); }
.notes-list { margin: 0; padding-left: 1.1rem; display: grid; gap: .35rem; color: var(--muted); font-size: .95rem; }
.todgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: .9rem; }
.tod { min-width: 0; display: grid; gap: .25rem; align-content: start; }
.tod h4 { margin: 0; font-family: var(--f-data); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); font-weight: 600; }
.tod td, .tod th { padding: .35rem .45rem; }
.trainers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); gap: .9rem; }
.trainer-card { border: 1px solid var(--line); border-radius: 4px; padding: .6rem .7rem; display: grid; gap: .3rem; min-width: 0; }
.trainer-card h4 { margin: 0; display: flex; align-items: center; gap: .5rem; font-size: 1rem; }
.trainer-card th, .trainer-card td { padding: .3rem .4rem; }

.team { display: grid; gap: 1rem; }
.team-intro h2 { font-size: 1.6rem; }
.team-intro p { margin: .3rem 0 0; color: var(--muted); max-width: 70ch; font-size: .95rem; }
.team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 18.5rem), 1fr)); gap: 1rem; }
.mon-card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 1rem .85rem; display: grid; gap: .8rem; align-content: start; min-width: 0; }
.mon-head { display: flex; gap: .8rem; align-items: center; }
.mon-sprite { width: 96px; height: 96px; image-rendering: pixelated; flex: none; background: var(--bg); border-radius: 50%; }
.mon-id { min-width: 0; display: grid; gap: .35rem; }
.mon-id h3 { margin: 0; font-family: var(--f-display); font-size: 1.4rem; }
.mon-id .lv { margin: 0; font-family: var(--f-data); font-size: .85rem; color: var(--muted); }
.types { display: flex; gap: .3rem; flex-wrap: wrap; }
.type { display: inline-block; font-family: var(--f-data); font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: .1rem .45rem; border-radius: 3px; background: var(--tc); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.35); }
.type.sm { font-size: .65rem; padding: .05rem .35rem; }
.mon-meta { display: grid; grid-template-columns: auto 1fr; gap: .1rem .6rem; margin: 0; font-size: .85rem; }
.mon-meta dt { color: var(--muted); }
.mon-meta dd { margin: 0; }
.role { margin: 0; font-size: .92rem; }
.stats { display: grid; gap: .3rem; }
.stat { display: grid; grid-template-columns: 5.2rem 1fr 2rem; align-items: center; gap: .5rem; font-size: .82rem; }
.stat .sl { color: var(--muted); white-space: nowrap; }
.stat.up .sl { color: var(--ink); font-weight: 700; }
.track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.fill { display: block; height: 100%; background: var(--wood-dark); border-radius: 0 4px 4px 0; }
.stat .sv { font-family: var(--f-data); font-variant-numeric: tabular-nums; text-align: right; }
.moves-t { font-size: .8rem; }
.moves-t th, .moves-t td { padding: .3rem .25rem; }
.moves-t th { font-size: .66rem; }
.moves-t td.n { white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

/* additions for this build's log */
a { color: var(--accent); text-underline-offset: 2px; }
.lede p { margin: 0 0 .6rem; }
.step > .lede { margin: 0; max-width: 68ch; }
.notes h3 { margin: .9rem 0 .3rem; }
.notes p { margin: 0 0 .5rem; max-width: 72ch; }
.moves li ul { margin: .5rem 0 0; padding-left: 1.1rem; display: grid; gap: .35rem; }
.run .moves li > p + .shots { margin-top: .1rem; }
.bugs td:last-child { color: var(--accent); font-weight: 600; }
</style>
<header class="masthead"><div class="wrap head">
  <p class="kicker">pokeemerald · kanto-hoenn branch · playthrough log</p>
  <h1>%%H1%%</h1>
  <p class="lede">%%LEDE%%</p>
  <div class="facts top">%%FACTS%%</div>
</div>
<nav class="tabs" aria-label="Pages"><div class="wrap tabrow">%%TABS%%</div></nav></header>
<main class="wrap">%%PAGES%%</main>
<script>
(function(){
  var pages = Array.prototype.slice.call(document.querySelectorAll('.page'));
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  function show(id, scroll){
    var found = pages.some(function(p){ return p.dataset.page === id; });
    if (!found) id = pages[0].dataset.page;
    pages.forEach(function(p){ p.hidden = p.dataset.page !== id; });
    tabs.forEach(function(t){ var on = t.dataset.page === id; t.classList.toggle('on', on); if (on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current'); });
    if (scroll) window.scrollTo(0, 0);
  }
  document.addEventListener('click', function(e){
    var a = e.target.closest('a[href^="#"]');
    if (!a) return;
    var id = a.getAttribute('href').slice(1);
    if (pages.some(function(p){ return p.dataset.page === id; })) { e.preventDefault(); try { history.replaceState(null, '', '#' + id); } catch (err) {} show(id, true); }
  });
  window.addEventListener('hashchange', function(){ show(location.hash.slice(1), true); });
  show(location.hash.slice(1), false);
})();
</script>
